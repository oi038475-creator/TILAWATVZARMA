name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir www
          cp index.html reader.html *.pdf www/
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js www/
      - run: npx cap add android
      - name: Icons
        run: |
          pip install pillow
          python3 - <<'PY'
          import re, base64, io, os, shutil
          from PIL import Image
          t=open('index.html',encoding='utf-8').read()
          m=max(re.findall(r'data:image/png;base64,([A-Za-z0-9+/=]+)',t),key=len)
          im=Image.open(io.BytesIO(base64.b64decode(m))).convert('RGB')
          res='android/app/src/main/res'
          shutil.rmtree(res+'/mipmap-anydpi-v26',ignore_errors=True)
          for d,n in (('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)):
              os.makedirs(f'{res}/mipmap-{d}',exist_ok=True)
              c=Image.new('RGB',(n,n),(255,255,255)); k=int(n*0.9); s=im.resize((k,k),Image.LANCZOS); c.paste(s,((n-k)//2,(n-k)//2))
              c.save(f'{res}/mipmap-{d}/ic_launcher.png'); c.save(f'{res}/mipmap-{d}/ic_launcher_round.png')
          PY
      - run: npx cap sync android
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tilawa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
